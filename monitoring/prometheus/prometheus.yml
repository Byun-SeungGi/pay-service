global:
  scrape_interval: 15s # 매트릭을 15초마다 수집하기

scrape_configs:
  - job_name: 'pay-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['host.docker.internal:8080']
        labels:
          application: 'pay-service'
          environment: 'local'

  - job_name: 'prometheus'
    static_configs:
      - targets: [ 'localhost:9090' ]