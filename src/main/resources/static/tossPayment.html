<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>지갑 충전</title>
    <script src="https://js.tosspayments.com/v2/standard"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --primary: #3182F6;
            --primary-hover: #2272eb;
            --primary-light: #e8f3ff;
            --bg: #f2f4f6;
            --card: #ffffff;
            --text: #191f28;
            --text-sub: #6b7684;
            --border: #e5e8eb;
            --shadow: 0 4px 24px rgba(0, 0, 0, 0.04);
        }

        body {
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 24px 16px;
            -webkit-font-smoothing: antialiased;
        }

        .header {
            width: 100%;
            max-width: 480px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            padding: 0 4px;
        }

        .logo {
            font-size: 20px;
            font-weight: 700;
            color: var(--primary);
            letter-spacing: -0.02em;
        }

        .user-badge {
            display: none;
            align-items: center;
            gap: 6px;
            background: var(--card);
            padding: 8px 14px;
            border-radius: 999px;
            font-size: 13px;
            font-weight: 500;
            color: var(--text-sub);
            box-shadow: var(--shadow);
        }

        .user-badge::before {
            content: '';
            width: 6px;
            height: 6px;
            background: #22c55e;
            border-radius: 50%;
        }

        .user-badge.active {
            display: inline-flex;
        }

        .card {
            width: 100%;
            max-width: 480px;
            background: var(--card);
            border-radius: 20px;
            padding: 32px 28px;
            box-shadow: var(--shadow);
            margin-bottom: 16px;
        }

        .card-title {
            font-size: 22px;
            font-weight: 700;
            letter-spacing: -0.02em;
            margin-bottom: 6px;
        }

        .card-desc {
            font-size: 14px;
            color: var(--text-sub);
            margin-bottom: 24px;
        }

        .field {
            margin-bottom: 14px;
        }

        .label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            color: var(--text-sub);
            margin-bottom: 8px;
        }

        .input {
            width: 100%;
            height: 52px;
            padding: 0 16px;
            border: 1px solid var(--border);
            border-radius: 12px;
            font-size: 16px;
            font-family: inherit;
            color: var(--text);
            background: #fff;
            transition: border-color 0.15s, box-shadow 0.15s;
            outline: none;
        }

        .input::placeholder {
            color: #b0b8c1;
        }

        .input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px var(--primary-light);
        }

        .input:disabled {
            background: #f7f8f9;
            color: var(--text-sub);
            cursor: not-allowed;
        }

        .amount-wrapper {
            position: relative;
        }

        .amount-wrapper .input {
            padding-right: 44px;
            font-size: 18px;
            font-weight: 600;
            text-align: right;
        }

        .amount-wrapper .unit {
            position: absolute;
            right: 16px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 15px;
            color: var(--text-sub);
            font-weight: 500;
        }

        .quick-amounts {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            margin-bottom: 20px;
        }

        .chip {
            height: 38px;
            border: 1px solid var(--border);
            background: #fff;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 500;
            color: var(--text-sub);
            cursor: pointer;
            font-family: inherit;
            transition: all 0.15s;
        }

        .chip:hover {
            border-color: var(--primary);
            color: var(--primary);
        }

        .btn {
            width: 100%;
            height: 56px;
            border: none;
            border-radius: 12px;
            background: var(--primary);
            color: #fff;
            font-size: 16px;
            font-weight: 700;
            font-family: inherit;
            cursor: pointer;
            transition: background 0.15s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn:hover:not(:disabled) {
            background: var(--primary-hover);
        }

        .btn:disabled {
            background: #d1d6db;
            cursor: not-allowed;
        }

        .btn .spinner {
            display: none;
            width: 18px;
            height: 18px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        .btn.loading .spinner {
            display: inline-block;
        }

        .btn .label {
            color: #fff;
            font-size: 16px;
            font-weight: 700;
            margin: 0;
            display: inline;
        }

        .btn.loading .label {
            display: none;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .hidden {
            display: none !important;
        }

        .footer {
            margin-top: 8px;
            font-size: 12px;
            color: var(--text-sub);
            text-align: center;
        }

        .toast {
            position: fixed;
            bottom: 32px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: #191f28;
            color: #fff;
            padding: 12px 20px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 500;
            opacity: 0;
            transition: all 0.25s ease;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.15);
            z-index: 100;
        }

        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        @media (max-width: 480px) {
            .card { padding: 24px 20px; border-radius: 16px; }
            .card-title { font-size: 20px; }
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="logo">PAY</div>
        <div class="user-badge" id="userBadge"></div>
    </div>

    <!-- 로그인 카드 -->
    <div class="card" id="loginCard">
        <h1 class="card-title">로그인</h1>
        <p class="card-desc">지갑 충전을 위해 로그인이 필요해요</p>

        <div class="field">
            <label class="label" for="email">이메일</label>
            <input class="input" type="email" id="email" placeholder="name@example.com" autocomplete="email" />
        </div>

        <div class="field">
            <label class="label" for="password">비밀번호</label>
            <input class="input" type="password" id="password" placeholder="비밀번호를 입력하세요" autocomplete="current-password" />
        </div>

        <button class="btn" id="loginBtn" onclick="login()" style="margin-top: 10px;">
            <span class="spinner"></span>
            <span class="label">로그인</span>
        </button>
    </div>

    <!-- 충전 카드 -->
    <div class="card hidden" id="chargeCard">
        <h1 class="card-title">지갑 충전</h1>
        <p class="card-desc">충전할 금액을 입력해주세요</p>

        <div class="field">
            <label class="label" for="amount">충전 금액</label>
            <div class="amount-wrapper">
                <input class="input" type="number" id="amount" placeholder="0" min="1000" step="1000" inputmode="numeric" />
                <span class="unit">원</span>
            </div>
        </div>

        <div class="quick-amounts">
            <button type="button" class="chip" onclick="addAmount(10000)">+1만</button>
            <button type="button" class="chip" onclick="addAmount(50000)">+5만</button>
            <button type="button" class="chip" onclick="addAmount(100000)">+10만</button>
            <button type="button" class="chip" onclick="clearAmount()">초기화</button>
        </div>

        <button class="btn" id="chargeBtn" onclick="charge()">
            <span class="spinner"></span>
            <span class="label">결제하기</span>
        </button>
    </div>

    <div class="footer">안전한 결제는 토스페이먼츠가 함께합니다</div>

    <div class="toast" id="toast"></div>

    <script>
        const tossPayments = TossPayments("test_ck_DpexMgkW36v60A970kEM3GbR5ozO");
        const payment = tossPayments.payment({ customerKey: "test-customer-key" });

        const $ = (id) => document.getElementById(id);

        function toast(message) {
            const t = $("toast");
            t.textContent = message;
            t.classList.add("show");
            clearTimeout(toast._t);
            toast._t = setTimeout(() => t.classList.remove("show"), 2200);
        }

        async function login() {
            const email = $("email").value.trim();
            const password = $("password").value;
            const btn = $("loginBtn");

            if (!email || !password) {
                toast("이메일과 비밀번호를 입력해주세요");
                return;
            }

            btn.classList.add("loading");
            btn.disabled = true;

            try {
                const res = await fetch("/api/v1/users/login", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ email, password })
                });
                const result = await res.json();

                if (res.ok && result.status === "SUCCESS") {
                    localStorage.setItem("token", result.data.accessToken);
                    const badge = $("userBadge");
                    badge.textContent = email;
                    badge.classList.add("active");
                    $("loginCard").classList.add("hidden");
                    $("chargeCard").classList.remove("hidden");
                } else {
                    toast("아이디 또는 비밀번호가 올바르지 않아요");
                }
            } catch (e) {
                toast("로그인 중 오류가 발생했어요");
            } finally {
                btn.classList.remove("loading");
                btn.disabled = false;
            }
        }

        function addAmount(value) {
            const input = $("amount");
            const current = Number(input.value) || 0;
            input.value = current + value;
        }

        function clearAmount() {
            $("amount").value = "";
        }

        function charge() {
            const amount = Number($("amount").value);

            if (!amount || amount < 1000) {
                toast("최소 1,000원 이상 입력해주세요");
                return;
            }

            payment.requestPayment({
                method: "CARD",
                amount: { currency: "KRW", value: amount },
                orderId: "ORDER_" + Date.now(),
                orderName: "지갑 충전 " + amount.toLocaleString() + "원",
                successUrl: window.location.origin + "/tossPayment-success.html",
                failUrl: window.location.origin + "/api/v1/payments/fail"
            });
        }

        // Enter 키로 로그인
        document.addEventListener("keypress", (e) => {
            if (e.key !== "Enter") return;
            if (!$("loginCard").classList.contains("hidden")) login();
            else if (!$("chargeCard").classList.contains("hidden")) charge();
        });

        // 이미 로그인된 상태면 충전 카드로 바로
        if (localStorage.getItem("token")) {
            $("loginCard").classList.add("hidden");
            $("chargeCard").classList.remove("hidden");
        }
    </script>
</body>
</html>
