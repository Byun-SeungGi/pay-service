<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>지갑 충전</title>
    <script src="https://js.tosspayments.com/v2/standard"></script>
    <style>
        #welcome {
            position: fixed;
            top: 10px;
            right: 20px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div id="welcome"></div>

    <h2>로그인</h2>
    <div id="loginSection">
        <input type="email" id="email" placeholder="이메일" />
        <input type="password" id="password" placeholder="비밀번호" />
        <button onclick="login()">로그인</button>
    </div>

    <h2>지갑 충전</h2>
    <input type="number" id="amount" placeholder="충전 금액" />
    <button id="chargeBtn" onclick="charge()" disabled>충전하기</button>

    <script>
        const tossPayments = TossPayments("test_ck_DpexMgkW36v60A970kEM3GbR5ozO");
        const payment = tossPayments.payment({customerKey : "test-customer-key"});

        async function login() {
            const email = document.getElementById("email").value;
            const password = document.getElementById("password").value;

            try {
                const res = await fetch("/api/v1/users/login", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ email, password })
                });

                const result = await res.json();

                if (res.ok && result.status === "SUCCESS") {
                    localStorage.setItem("token", result.data.accessToken);
                    document.getElementById("welcome").textContent = email + " 님 환영합니다!";
                    document.getElementById("loginSection").style.display = "none";
                    document.getElementById("chargeBtn").disabled = false;
                } else {
                    alert("아이디와 비밀번호를 확인해주세요.");
                }
            } catch (e) {
                alert("아이디와 비밀번호를 확인해주세요.");
            }
        }

        function charge() {
            const amount = document.getElementById("amount").value;

            payment.requestPayment({
                method: "CARD",
                amount: {
                    currency: "KRW",
                    value: Number(amount)
                },
                orderId: "ORDER_" + Date.now(),
                orderName: "지갑 충전 " + amount + "원",
                successUrl: window.location.origin + "/tossPayment-success.html",
                failUrl: window.location.origin + "/api/v1/payments/fail"
            });
        }
    </script>
</body>
</html>
