<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>결제 결과</title>
</head>
<body>
    <h2 id="resultTitle">결제 처리 중...</h2>
    <p id="resultMessage"></p>

    <script>
        (async function () {
            const params = new URLSearchParams(window.location.search);
            const paymentKey = params.get("paymentKey");
            const orderId = params.get("orderId");
            const amount = params.get("amount");
            const token = localStorage.getItem("token");

            const titleEl = document.getElementById("resultTitle");
            const msgEl = document.getElementById("resultMessage");

            if (!token) {
                titleEl.textContent = "결제 실패";
                msgEl.textContent = "로그인 정보가 없습니다. 다시 로그인 후 시도해주세요.";
                return;
            }

            try {
                const res = await fetch(
                    `/api/v1/payments/confirm?paymentKey=${encodeURIComponent(paymentKey)}&orderId=${encodeURIComponent(orderId)}&amount=${encodeURIComponent(amount)}`,
                    {
                        method: "POST",
                        headers: { "Authorization": "Bearer " + token }
                    }
                );

                const result = await res.json();

                if (res.ok && result.status === "SUCCESS") {
                    titleEl.textContent = "결제 완료";
                    msgEl.textContent = result.message;
                } else {
                    titleEl.textContent = "결제 실패";
                    msgEl.textContent = result.message || "결제 승인에 실패했습니다.";
                }
            } catch (e) {
                titleEl.textContent = "결제 실패";
                msgEl.textContent = "서버 요청 중 오류가 발생했습니다.";
            }
        })();
    </script>
</body>
</html>
