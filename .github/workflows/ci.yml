name: Pay Service CI

on:
  pull_request:
    branches: [ "develop" ] # develop으로 PR 생성 시 실행

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: pay_service
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

      redis:
        image: redis:alpine
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        env:
          DB_URL: jdbc:mysql://localhost:3306/pay_service?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
          DB_USERNAME: root
          DB_PASSWORD: root
          MYSQL_PASSWORD: root

          JWT_SECRET: ${{ secrets.JWT_SECRET }}

        run: ./gradlew clean build