version: '3.8'

services:
  # MySQL 8.0 설정
  pay-db:
    image: mysql:8.0
    container_name: pay-db
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: pay_service
      TZ: Asia/Seoul
    volumes:
      - ./db/data:/var/lib/mysql
      - ./db/init:/docker-entrypoint-initdb.d
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    restart: always

  # Redis 설정
  pay-redis:
    image: redis:alpine
    container_name: pay-redis
    ports:
      - "6379:6379"
    restart: always

  # Zookeeper - Kafka 클러스터 관리
  pay-zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: pay_zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
    ports:
      - "2181:2181"
    restart: always

  # Kafka 브로커
  pay-kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: pay-kafka
    depends_on:
      - pay-zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: pay-zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    restart: always
